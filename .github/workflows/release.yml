name: Build Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (arm64). For Intel Macs use macos-13 instead.
          - os: macos-14
            artifact: Partiu-macOS.zip
          - os: windows-latest
            artifact: Partiu.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project + Nuitka
        run: python -m pip install --upgrade pip . nuitka zstandard

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m nuitka --standalone --macos-create-app-bundle --macos-app-name=Partiu \
            --enable-plugin=tk-inter \
            --include-package=PIL \
            --include-package=pdfplumber \
            --include-package=pdfminer \
            --include-package=pypdfium2 \
            --include-package-data=pdfminer \
            --include-package-data=pypdfium2 \
            --assume-yes-for-downloads \
            run.py
          # Ad-hoc sign so the bundle is internally consistent (still unsigned
          # for distribution; users may need to right-click -> Open the first time).
          codesign --force --deep --sign - "Partiu.app"
          ditto -c -k --keepParent "Partiu.app" "Partiu-macOS.zip"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: >-
          python -m nuitka --standalone --onefile
          --enable-plugin=tk-inter
          --include-package=PIL
          --include-package=pdfplumber
          --include-package=pdfminer
          --include-package=pypdfium2
          --include-package-data=pdfminer
          --include-package-data=pypdfium2
          --windows-console-mode=disable
          --output-filename=Partiu.exe
          --assume-yes-for-downloads
          run.py

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
