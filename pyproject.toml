[project]
name = "partiu"
version = "0.1.0"
description = "Offline component tracker (tkinter GUI + pure SQLite, no external deps)"
authors = [
    {name = "Vitor Roque", email = "vitor.roquep@gmail.com"}
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.0",
]

[tool.poetry]
packages = [
    { include = "partiu", from = "src" }
]

[tool.poetry.scripts]
partiu = "partiu.main:main"

[tool.poetry.group.dev.dependencies]
nuitka = { version = ">=2.0.0", extras = ["app", "onefile"] }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
